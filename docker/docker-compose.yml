version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiprompthub-postgres
    environment:
      POSTGRES_DB: aiprompthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: aiprompthub-redis
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: aiprompthub-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aiprompthub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aiprompthub
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - redis
      - ai-service

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aiprompthub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
